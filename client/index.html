<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/_catalog/ui/favicon.svg" />
    <link rel="preload" href="/_catalog/ui/fonts/DMSans-100_1000-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>App Catalog</title>
    <script>
      // Apply the saved theme before first paint, so a light-theme user never sees a dark flash.
      try { var t = localStorage.getItem('app-catalog-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
